<!-- Add Student Button - Add this to your main page where appropriate -->
<button id="openAddStudentModal" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition-colors flex items-center">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
    <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
  </svg>
  Add Student
</button>

<!-- Modal Overlay - Add this at the end of your body tag -->
<div id="addStudentModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden">
    <!-- Modal Header -->
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-medium text-dark">Add New Student</h3>
        <button id="closeAddStudentModal" class="text-gray-400 hover:text-gray-500 focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Modal Body -->
    <div class="px-6 py-4">
      <form id="addStudentForm" class="space-y-4">
        <!-- Name Field -->
        <div>
          <label for="studentName" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          <input type="text" id="studentName" name="name" required
            class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          <p id="nameError" class="text-red-500 text-xs mt-1 hidden">Please enter a valid name</p>
        </div>
        
        <!-- Gender Field -->
        <div>
          <label for="studentGender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
          <select id="studentGender" name="gender" required
            class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            <option value="" disabled selected>Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <p id="genderError" class="text-red-500 text-xs mt-1 hidden">Please select a gender</p>
        </div>
        
        <!-- Password Field -->
        <div>
          <label for="studentPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="studentPassword" name="password" required
              class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" id="eyeIcon">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
          <p id="passwordError" class="text-red-500 text-xs mt-1 hidden">Password must be at least 6 characters</p>
        </div>
      </form>
    </div>
    
    <!-- Modal Footer -->
    <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
      <button id="cancelAddStudent" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">
        Cancel
      </button>
      <button id="submitAddStudent" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition-colors">
        Add Student
      </button>
    </div>
  </div>
</div>
