<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header Section -->
        <header class="mb-10">
            <h1 class="text-3xl font-bold text-dark mb-2">User Dashboard</h1>
            <p class="text-gray-600">Manage and view all user data</p>
        </header>

        <!-- Search and Filter Section -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search users..." 
                    class="w-full md:w-1/3 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-primary">
                <h3 class="text-gray-500 text-sm font-medium">Total Users</h3>
                <p class="text-2xl font-bold text-dark mt-2" id="totalUsers">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-secondary">
                <h3 class="text-gray-500 text-sm font-medium">Male Users</h3>
                <p class="text-2xl font-bold text-dark mt-2" id="maleUsers">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-purple-500">
                <h3 class="text-gray-500 text-sm font-medium">Female Users</h3>
                <p class="text-2xl font-bold text-dark mt-2" id="femaleUsers">0</p>
            </div>
        </div>

        <!-- User Data Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                <h2 class="text-lg font-medium text-dark">User List</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Gender</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- User data will be inserted here -->
                    </tbody>
                </table>
            </div>
            <div id="noResults" class="hidden p-8 text-center text-gray-500">
                No users found matching your search.
            </div>
        </div>

        <!-- User Cards (Mobile View) -->
        <div id="userCards" class="grid grid-cols-1 gap-4 mt-6 md:hidden">
            <!-- User cards will be inserted here for mobile view -->
        </div>
    </div>

    <script>
// Show loading state
function showLoading() {
  const tableBody = document.getElementById('userTableBody');
  const userCards = document.getElementById('userCards');
  
  // Clear existing content
  tableBody.innerHTML = '';
  userCards.innerHTML = '';
  
  // Add loading indicators
  tableBody.innerHTML = `
    <tr>
      <td colspan="4" class="px-6 py-4 text-center">
        <div class="flex justify-center items-center">
          <svg class="animate-spin h-5 w-5 text-primary mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Loading data...</span>
        </div>
      </td>
    </tr>
  `;
  
  userCards.innerHTML = `
    <div class="bg-white rounded-lg shadow p-4 w-full">
      <div class="flex justify-center items-center py-4">
        <svg class="animate-spin h-5 w-5 text-primary mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Loading data...</span>
      </div>
    </div>
  `;
}

// Show error state
function showError(error) {
  const tableBody = document.getElementById('userTableBody');
  const userCards = document.getElementById('userCards');
  
  // Clear existing content
  tableBody.innerHTML = '';
  userCards.innerHTML = '';
  
  // Add error message
  tableBody.innerHTML = `
    <tr>
      <td colspan="4" class="px-6 py-4 text-center text-red-500">
        <div class="flex flex-col justify-center items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <span>Error loading data: ${error.message}</span>
          <button id="retryButton" class="mt-3 px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition-colors">
            Retry
          </button>
        </div>
      </td>
    </tr>
  `;
  
  userCards.innerHTML = `
    <div class="bg-white rounded-lg shadow p-4 w-full">
      <div class="flex flex-col justify-center items-center py-4 text-red-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>Error loading data: ${error.message}</span>
        <button id="retryButtonMobile" class="mt-3 px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition-colors">
          Retry
        </button>
      </div>
    </div>
  `;
  
  // Add event listeners to retry buttons
  document.getElementById('retryButton').addEventListener('click', fetchData);
  document.getElementById('retryButtonMobile').addEventListener('click', fetchData);
}

// Function to render user data
function renderUsers(users) {
  const tableBody = document.getElementById('userTableBody');
  const userCards = document.getElementById('userCards');
  const totalUsersElement = document.getElementById('totalUsers');
  const maleUsersElement = document.getElementById('maleUsers');
  const femaleUsersElement = document.getElementById('femaleUsers');
  
  // Clear existing content
  tableBody.innerHTML = '';
  userCards.innerHTML = '';
  
  // Count statistics
  totalUsersElement.textContent = users.length;
  const maleCount = users.filter(user => user.gender.toLowerCase().includes('male') && !user.gender.toLowerCase().startsWith('fe')).length;
  const femaleCount = users.filter(user => user.gender.toLowerCase().includes('female')).length;
  maleUsersElement.textContent = maleCount;
  femaleUsersElement.textContent = femaleCount;
  
  // Check if there are no users
  if (users.length === 0) {
    document.getElementById('noResults').classList.remove('hidden');
  } else {
    document.getElementById('noResults').classList.add('hidden');
  }
  
  // Render each user
  users.forEach(user => {
    // Create table row for desktop view
    const row = document.createElement('tr');
    row.className = 'hover:bg-gray-50 transition-colors';
    row.innerHTML = `
      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.id}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.name}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${user.gender.toLowerCase().includes('female') ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">
          ${user.gender}
        </span>
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        <button class="text-primary hover:text-primary-dark mr-3" onclick="editUser(${user.id})">Edit</button>
        <button class="text-red-500 hover:text-red-700" onclick="deleteUser(${user.id})">Delete</button>
      </td>
    `;
    tableBody.appendChild(row);
    
    // Create card for mobile view
    const card = document.createElement('div');
    card.className = 'bg-white rounded-lg shadow p-4';
    card.innerHTML = `
      <div class="flex justify-between items-start">
        <div>
          <h3 class="text-lg font-medium text-gray-900">${user.name}</h3>
          <p class="text-sm text-gray-500">ID: ${user.id}</p>
        </div>
        <span class="px-2 py-1 text-xs font-semibold rounded-full ${user.gender.toLowerCase().includes('female') ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">
          ${user.gender}
        </span>
      </div>
      <div class="mt-4 flex justify-end space-x-3">
        <button class="px-3 py-1 text-sm text-primary border border-primary rounded hover:bg-primary hover:text-white transition-colors" onclick="editUser(${user.id})">Edit</button>
        <button class="px-3 py-1 text-sm text-white bg-red-500 rounded hover:bg-red-600 transition-colors" onclick="deleteUser(${user.id})">Delete</button>
      </div>
    `;
    userCards.appendChild(card);
  });
}

// Placeholder functions for edit and delete (you can implement these later)
function editUser(id) {
  console.log(`Edit user with ID: ${id}`);
  // Implement edit functionality
}

function deleteUser(id) {
  console.log(`Delete user with ID: ${id}`);
  // Implement delete functionality
}

// Global variable to store API response
let apiResponse = null;

// Function to fetch data from API
async function fetchData() {
  try {
    showLoading();
    
    const response = await fetch('http://localhost:8080/student');
    
    // Check if the response is ok (status in the range 200-299)
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    
    apiResponse = await response.json();
    
    // Check if the API response has the expected structure
    if (!apiResponse || !apiResponse.payloads || !Array.isArray(apiResponse.payloads)) {
      throw new Error('Invalid API response format');
    }
    
    // Render the users
    renderUsers(apiResponse.payloads);
    
    // Set up search functionality
    setupSearch();
    
  } catch (error) {
    console.error('Error fetching data:', error);
    showError(error);
  }
}

// Function to set up search functionality
function setupSearch() {
  const searchInput = document.getElementById('searchInput');
  
  searchInput.addEventListener('input', function(e) {
    if (!apiResponse || !apiResponse.payloads) return;
    
    const searchTerm = e.target.value.toLowerCase();
    const filteredUsers = apiResponse.payloads.filter(user => 
      user.name.toLowerCase().includes(searchTerm) || 
      user.gender.toLowerCase().includes(searchTerm) ||
      user.id.toString().includes(searchTerm)
    );
    
    renderUsers(filteredUsers);
  });
  
  // Clear any previous search
  searchInput.value = '';
}

// Initialize the application when the DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
  fetchData();
});
    </script>
</body>
</html>
